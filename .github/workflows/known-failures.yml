name: Known failures

on:
  workflow_dispatch:

jobs:

  package-test:
    strategy:
      fail-fast: false
      matrix:
        package:
          - '@babel/core'
          - ava
          - clinic
          - fastify
          - jest
          - node-gyp
          - pino
          - readable-stream
          - uuid
          - weak

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Install packages
        run: npm ci

      - name: Run CITGM
        run: node bin/citgm.js ${{ matrix.package }}
