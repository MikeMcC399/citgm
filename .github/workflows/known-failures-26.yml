name: Known failures 26

on:
  workflow_dispatch:

jobs:
  package-test:
    strategy:
      fail-fast: false
      matrix:
        package:
          - '@babel/core'
          - '@yarnpkg/cli'
          - ava
          - body-parser
          - compression
          - fastify
          - jest
          - lru-cache
          - on-finished
          - path-to-regexp
          - undici

    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true

      - name: Install packages
        run: npm ci

      - name: Run CITGM
        run: node bin/citgm.js ${{ matrix.package }}
