name: Known failures 26

on:
  workflow_dispatch:

jobs:
  package-test:
    strategy:
      fail-fast: false
      matrix:
        package:
          - '@babel/core' # needs right skip
          - '@yarnpkg/cli' # ESLint outdated
          - ava # pnpm repository normalization
          - body-parser # release is planned
          - compression
          # - fastify # nofailure
          - jest
          - lru-cache # flaky
          # - on-finished # fixed in 2.4.2
          # - path-to-regexp # timeout in Jenkins, no repro in GitHub Actions
          # - undici # only fails in Windows

    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true

      - name: Install packages
        run: npm ci

      - name: Run CITGM
        run: node bin/citgm.js ${{ matrix.package }}
